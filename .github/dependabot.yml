# Scheduled dependency updates.
#
# Security alerts arrive on their own regardless of this file; what it adds is the
# weekly sweep that keeps ordinary version drift from piling up until the only way
# out is a large, risky bump.
#
# Updates are grouped so one PR carries a whole category. Ungrouped, a week of npm
# releases lands as a dozen separate PRs that each need CI, and the volume is what
# makes people stop reading them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
