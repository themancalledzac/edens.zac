# Frontend verification on every pull request and every push to main.
#
# Runs the same four checks CLAUDE.md prescribes locally — type check, ESLint,
# Stylelint, Jest — so a claim that they pass stops being local-only, plus an
# `npm audit` gate at high severity and above.
#
# The audit step lives in this job rather than its own because this job's name is
# the required status check on main. A separate job would need adding to branch
# protection by hand to block anything, and until someone did that it would be a
# security gate that gates nothing.
#
# One job, not four: `npm ci` dominates the wall clock, and splitting the checks
# would pay for it once per job. Every check step is `if: always()` so a single
# run reports all five verdicts instead of stopping at the first failure.
#
# The Node version comes from `.nvmrc`, which is the one place it is written down.
# `engines.node` in package.json is a floor, not a second pin; `tests/ci/ciWorkflow.test.ts`
# asserts the blessed version clears it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: always()
        run: npm run type-check

      - name: ESLint
        if: always()
        run: npm run lint:js

      - name: Stylelint
        if: always()
        run: npm run lint:css

      - name: Jest
        if: always()
        run: npm test -- --ci

      - name: Audit dependencies
        if: always()
        run: npm run audit
