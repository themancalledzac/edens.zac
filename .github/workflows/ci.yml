# Runs the four checks CLAUDE.md prescribes locally, so they stop being local-only.
# One job because `npm ci` dominates the clock; every check is `if: always()` so one run
# reports all four. Node 22 is the top of the `engines` range in package.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: always()
        run: npm run type-check

      - name: ESLint
        if: always()
        run: npm run lint:js

      - name: Stylelint
        if: always()
        run: npm run lint:css

      - name: Jest
        if: always()
        run: npm test -- --ci
